<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emoji Match - Game</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <h1>Find the Right Emotion</h1>

    <div id="targetBox" class="target-box">Target: 
    <span id="targetName"></span></div>
    <div id="scoreBox" class="score-box">EXP: 0 / 5</div>
    <div id="progressBox" class="progress-box hidden"></div>

    <div id="choicesGrid" class="grid"></div>

    <div id="resultBox" class="result hidden"></div>
    <div id="summaryContainer" class="summary-container hidden">
      <h2>Your Level 2 Answers</h2>
      <div id="summaryBox" class="summary-grid"></div>
    </div>
    <div class="button-row">
      <button id="restartBtn" class="start hidden">Play Again</button>
      <button id="nextlvl" class="start hidden">Continue</button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
